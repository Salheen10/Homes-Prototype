<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homes BRD - Advanced Role-Based Interactive Prototype</title>
  <style>
    :root{
      --bg:#08111f;
      --panel:#101b2d;
      --panel-2:#13223a;
      --panel-3:#0d1728;
      --text:#eef5ff;
      --muted:#9fb0ca;
      --line:rgba(255,255,255,.10);
      --soft:rgba(255,255,255,.06);
      --accent:#55d6be;
      --accent-2:#7c5cff;
      --danger:#ff5f73;
      --warning:#ffcc66;
      --success:#58d68d;
      --blue:#58a6ff;
      --shadow:0 24px 70px rgba(0,0,0,.42);
      --radius:22px;
      --radius-sm:14px;
      --font:"Inter", "Segoe UI", Tahoma, Arial, sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(circle at 10% 0%, rgba(85,214,190,.18), transparent 32%),
        radial-gradient(circle at 92% 8%, rgba(124,92,255,.20), transparent 35%),
        radial-gradient(circle at 50% 100%, rgba(88,166,255,.12), transparent 36%),
        var(--bg);
      color:var(--text);
      font-family:var(--font);
      overflow:hidden;
    }
    button,input,select,textarea{font-family:inherit}
    .app{height:100vh;display:grid;grid-template-columns:310px 1fr;gap:0;overflow:hidden}
    aside{
      background:linear-gradient(180deg, rgba(11,20,36,.98), rgba(9,15,27,.96));
      border-left:1px solid var(--line);
      box-shadow:12px 0 50px rgba(0,0,0,.22);
      padding:18px 14px;
      overflow:auto;
    }
    main{overflow:auto;padding:22px 24px 80px;position:relative}
    .brand{
      display:flex;align-items:center;gap:12px;padding:8px 8px 18px;margin-bottom:8px;
      border-bottom:1px solid var(--line);
    }
    .logo{
      width:44px;height:44px;border-radius:15px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:grid;place-items:center;color:#06101d;font-weight:950;box-shadow:0 12px 30px rgba(85,214,190,.18);
      letter-spacing:-1px;
    }
    .brand h1{font-size:17px;margin:0;line-height:1.15}
    .brand p{font-size:12px;margin:4px 0 0;color:var(--muted)}
    .persona-card{
      margin:14px 4px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));
      box-shadow:0 16px 40px rgba(0,0,0,.16);
    }
    .label{font-size:11px;color:var(--muted);margin-bottom:7px;display:block}
    .select, .input, textarea{
      width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,.07);color:var(--text);outline:none;
    }
    .select option{background:#0e1728;color:#fff}
    .persona-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .meta-pill{
      border:1px solid var(--line);border-radius:14px;padding:9px;background:rgba(0,0,0,.12);
      min-height:54px;
    }
    .meta-pill span{display:block;font-size:10px;color:var(--muted)}
    .meta-pill strong{display:block;font-size:12px;margin-top:4px}
    .nav-title{font-size:11px;color:var(--muted);padding:14px 12px 6px;text-transform:uppercase;letter-spacing:.08em}
    .nav-item{
      width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
      border:1px solid transparent;background:transparent;color:var(--text);padding:10px 10px;
      border-radius:16px;cursor:pointer;transition:.18s ease;margin:2px 0;text-align:right;
    }
    .nav-item:hover{background:rgba(255,255,255,.065);border-color:var(--line)}
    .nav-item.active{
      background:linear-gradient(90deg, rgba(85,214,190,.18), rgba(124,92,255,.13));
      border-color:rgba(85,214,190,.35);
      box-shadow:inset 0 0 0 1px rgba(85,214,190,.05);
    }
    .nav-left{display:flex;align-items:center;gap:10px;min-width:0}
    .nav-icon{width:30px;height:30px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:0 0 auto}
    .nav-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status-dot{font-size:10px;border-radius:99px;padding:4px 7px;border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
    .status-full{color:#07160f;background:var(--success);border-color:transparent}
    .status-limited{color:#201500;background:var(--warning);border-color:transparent}
    .status-denied{color:#fff;background:rgba(255,95,115,.18);border-color:rgba(255,95,115,.35)}
    .topbar{
      display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;
      position:sticky;top:-22px;z-index:20;padding:22px 0 12px;
      background:linear-gradient(180deg,rgba(8,17,31,.98),rgba(8,17,31,.86),rgba(8,17,31,0));
      backdrop-filter:blur(10px);
    }
    .page-title h2{margin:0;font-size:27px;letter-spacing:-.03em}
    .page-title p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:900px;line-height:1.6}
    .top-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .btn{
      border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);border-radius:14px;
      padding:10px 13px;cursor:pointer;transition:.18s ease;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:12px;
    }
    .btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.11)}
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06101d;border-color:transparent}
    .btn.danger{background:rgba(255,95,115,.14);border-color:rgba(255,95,115,.35)}
    .btn.success{background:rgba(88,214,141,.16);border-color:rgba(88,214,141,.35)}
    .btn.warning{background:rgba(255,204,102,.16);border-color:rgba(255,204,102,.35)}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .grid{display:grid;gap:14px}
    .cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}
    .card{
      border:1px solid var(--line);border-radius:var(--radius);background:
        linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
      box-shadow:0 20px 55px rgba(0,0,0,.18);padding:16px;position:relative;overflow:hidden;
    }
    .card::before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(circle at 0% 0%, rgba(255,255,255,.06), transparent 30%);
    }
    .card h3{margin:0 0 9px;font-size:16px;letter-spacing:-.01em}
    .card p{color:var(--muted);font-size:13px;line-height:1.65;margin:0}
    .stat{
      min-height:125px;display:flex;flex-direction:column;justify-content:space-between;
    }
    .stat .num{font-size:31px;font-weight:950;letter-spacing:-.04em}
    .stat .hint{font-size:12px;color:var(--muted);line-height:1.5}
    .stat .mini{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
    .stat .mini span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px}
    .badge{
      display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.06);
      border-radius:999px;padding:5px 9px;font-size:11px;color:var(--muted);white-space:nowrap;
    }
    .badge.full{background:rgba(88,214,141,.16);border-color:rgba(88,214,141,.3);color:#a9f3c8}
    .badge.limited{background:rgba(255,204,102,.14);border-color:rgba(255,204,102,.28);color:#ffe0a3}
    .badge.denied{background:rgba(255,95,115,.14);border-color:rgba(255,95,115,.3);color:#ffbdc6}
    .badge.blue{background:rgba(88,166,255,.14);border-color:rgba(88,166,255,.3);color:#b6d6ff}
    .badge.accent{background:rgba(85,214,190,.13);border-color:rgba(85,214,190,.28);color:#bff5ec}
    .section{
      margin-bottom:15px;
    }
    .section-head{
      display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 10px;
    }
    .section-head h3{margin:0;font-size:18px}
    .section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .access-banner{
      display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;
      padding:14px;border-radius:var(--radius);border:1px solid var(--line);
      background:linear-gradient(90deg,rgba(85,214,190,.10),rgba(124,92,255,.08));
    }
    .access-banner strong{font-size:14px}
    .access-banner p{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.55}
    .table-wrap{
      border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:rgba(255,255,255,.035);
    }
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:right}
    th{color:#bfd0e8;background:rgba(255,255,255,.065);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    tr:hover td{background:rgba(255,255,255,.035)}
    tr:last-child td{border-bottom:none}
    .masked{
      color:transparent;text-shadow:0 0 9px rgba(255,255,255,.45);user-select:none;
    }
    .locked-cell{display:flex;align-items:center;gap:7px;color:var(--muted)}
    .toolbar{
      display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;
    }
    .toolbar .input,.toolbar .select{max-width:220px}
    .drawer{
      position:fixed;top:0;left:0;width:430px;max-width:96vw;height:100vh;background:#0b1424;border-right:1px solid var(--line);
      box-shadow:-20px 0 70px rgba(0,0,0,.45);z-index:80;transform:translateX(-105%);transition:.25s ease;
      padding:18px;overflow:auto;
    }
    .drawer.open{transform:translateX(0)}
    .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
    .drawer h3{margin:0;font-size:20px}
    .kv{display:grid;grid-template-columns:120px 1fr;gap:8px;border-bottom:1px solid rgba(255,255,255,.075);padding:10px 0;font-size:13px}
    .kv span:first-child{color:var(--muted)}
    .modal-backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.56);backdrop-filter:blur(7px);z-index:90;display:none;align-items:center;justify-content:center;padding:20px;
    }
    .modal-backdrop.show{display:flex}
    .modal{
      width:min(640px,96vw);border:1px solid var(--line);border-radius:28px;background:
      linear-gradient(180deg,rgba(20,31,52,.98),rgba(11,20,36,.98));box-shadow:var(--shadow);padding:20px;
    }
    .modal h3{margin:0 0 8px;font-size:22px}
    .modal p{margin:0;color:var(--muted);line-height:1.7}
    .modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
    .toast{
      position:fixed;bottom:20px;right:20px;z-index:120;display:grid;gap:10px;
    }
    .toast-item{
      border:1px solid var(--line);background:rgba(12,22,39,.96);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px;
      min-width:260px;max-width:430px;font-size:13px;animation:pop .2s ease;
    }
    @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
    .pipeline{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow:auto;padding-bottom:8px}
    .lane{border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,255,255,.035);min-height:260px;padding:12px}
    .lane h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;color:#d9e7fb}
    .deal-card,.lead-card,.candidate-card{
      border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.06);padding:11px;margin-bottom:10px;
    }
    .deal-card strong,.lead-card strong,.candidate-card strong{font-size:13px}
    .deal-card p,.lead-card p,.candidate-card p{font-size:12px;margin:5px 0;color:var(--muted);line-height:1.45}
    .progress{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
    .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px}
    .bars{display:grid;gap:9px;margin-top:8px}
    .bar{display:grid;grid-template-columns:120px 1fr 42px;gap:10px;align-items:center;font-size:12px}
    .bar-track{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
    .bar-track span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
    .flow{
      display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px;overflow:auto;padding-bottom:8px
    }
    .flow-step{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.055);padding:12px;position:relative;min-height:128px}
    .flow-step b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06101d;margin-bottom:8px}
    .flow-step h4{margin:0 0 6px;font-size:13px}
    .flow-step p{font-size:12px;line-height:1.5}
    .permission-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .perm{
      display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:14px;padding:10px;
      min-height:48px;font-size:12px;
    }
    .perm input{accent-color:#55d6be}
    .role-lens{
      display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;margin-bottom:16px;
    }
    .lens-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .empty{
      border:1px dashed rgba(255,255,255,.22);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted);
      background:rgba(255,255,255,.025);
    }
    .split{
      display:grid;grid-template-columns:1.1fr .9fr;gap:14px;
    }
    .phone-frame{
      width:100%;max-width:330px;margin:auto;border:1px solid var(--line);border-radius:34px;padding:14px;background:#050a13;box-shadow:0 24px 70px rgba(0,0,0,.34);
    }
    .phone-screen{border-radius:24px;overflow:hidden;background:#101b2d;min-height:520px;border:1px solid rgba(255,255,255,.08)}
    .phone-top{height:44px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
    .property-img{
      height:150px;border-radius:18px;background:
        linear-gradient(135deg,rgba(85,214,190,.25),rgba(124,92,255,.25)),
        repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 10px,rgba(255,255,255,.025) 10px 20px);
      display:flex;align-items:end;padding:12px;
    }
    .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .timeline{display:grid;gap:10px}
    .event{
      border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.045);padding:11px;position:relative
    }
    .event small{color:var(--muted)}
    .event strong{display:block;margin:3px 0 4px}
    .toggle{
      display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.045)
    }
    .toggle button{border:0;background:transparent;color:var(--muted);padding:8px 11px;cursor:pointer}
    .toggle button.on{background:var(--accent);color:#06101d;font-weight:900}
    .heat{
      display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px
    }
    .heat span{height:28px;border-radius:8px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:10px;color:var(--muted)}
    .heat span.hot{background:rgba(255,95,115,.28);color:#fff}
    .heat span.warm{background:rgba(255,204,102,.24);color:#fff}
    .heat span.cool{background:rgba(85,214,190,.20);color:#fff}
    .deny-illustration{
      height:150px;border-radius:24px;background:
        radial-gradient(circle at 30% 20%,rgba(255,95,115,.25),transparent 28%),
        radial-gradient(circle at 75% 70%,rgba(124,92,255,.22),transparent 30%),
        rgba(255,255,255,.04);
      border:1px solid var(--line);display:grid;place-items:center;font-size:54px;margin-bottom:14px;
    }
    .req-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .req{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:16px;padding:12px}
    .req b{font-size:12px}
    .req p{font-size:11px;margin:6px 0 0}
    @media(max-width:1200px){
      .app{grid-template-columns:1fr}
      aside{display:none}
      .cols-4,.cols-5,.role-lens,.split{grid-template-columns:1fr}
      .cols-3{grid-template-columns:1fr 1fr}
      .topbar{position:relative;top:0}
      body{overflow:auto}
      main{overflow:visible}
    }
    @media(max-width:720px){
      main{padding:14px}
      .cols-2,.cols-3{grid-template-columns:1fr}
      .permission-grid,.req-grid{grid-template-columns:1fr}
      .topbar{flex-direction:column}
      .drawer{width:100vw}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="logo">H</div>
        <div>
          <h1>Homes OS Prototype</h1>
          <p>Advanced RBAC + Persona Simulation</p>
        </div>
      </div>

      <div class="persona-card">
        <label class="label">اختار Persona / Role وشوف النظام بيتغير فعليًا</label>
        <select id="personaSelect" class="select"></select>
        <div class="persona-meta">
          <div class="meta-pill"><span>Scope</span><strong id="metaScope">—</strong></div>
          <div class="meta-pill"><span>Department</span><strong id="metaDept">—</strong></div>
        </div>
      </div>

      <div id="nav"></div>
    </aside>

    <main>
      <div class="topbar">
        <div class="page-title">
          <h2 id="pageTitle">—</h2>
          <p id="pageSubtitle">—</p>
        </div>
        <div class="top-actions">
          <button class="btn" id="mobilePersonaBtn">👤 Change Persona</button>
          <button class="btn" id="explainRoleBtn">🔎 Explain Current Access</button>
          <button class="btn danger" id="resetBtn">↺ Reset Demo Data</button>
        </div>
      </div>

      <section id="roleLens"></section>
      <section id="content"></section>
    </main>
  </div>

  <div id="drawer" class="drawer"></div>
  <div id="modal" class="modal-backdrop"></div>
  <div id="toast" class="toast"></div>

<script>
(function(){
  const STORAGE_KEY = "homes_brd_advanced_prototype_v2";

  const modules = [
    {id:"dashboard", icon:"📊", name:"Command Center", group:"Core OS", desc:"Landing dashboard changes completely based on persona, scope, and accessible KPIs."},
    {id:"marketplace", icon:"🏠", name:"Marketplace", group:"Demand", desc:"Customer discovery, inquiries, tour requests, favorites, and source context."},
    {id:"marketplaceDashboard", icon:"📈", name:"Marketplace Dashboard", group:"Demand", desc:"Traffic, inquiry, tour, source, project, developer, and funnel visibility."},
    {id:"crm", icon:"🎯", name:"CRM Leads", group:"Sales Execution", desc:"Lead intake, duplicate control, ownership, manager queue, and scoped lead lists."},
    {id:"hierarchy", icon:"🧭", name:"Lead Hierarchy", group:"Sales Execution", desc:"Sales Director → Manager → Team Leader → Agent assignment and SLA governance."},
    {id:"buyer", icon:"🧩", name:"Buyer Preferences", group:"Sales Execution", desc:"Structured buyer briefs and inventory matching localized for Egypt."},
    {id:"inventory", icon:"🏗️", name:"Inventory Workspace", group:"Sales Execution", desc:"Developer/project/compound/unit workspace with marketplace/developer/manual origin."},
    {id:"tasks", icon:"✅", name:"Tasks, Calendar & Tours", group:"Sales Execution", desc:"Next actions, overdue tasks, tours, notifications, and escalation."},
    {id:"deals", icon:"🤝", name:"Deals & Contracts", group:"Finance/Sales", desc:"Pipeline, contracts, reservation, closed won/lost, commission foundation."},
    {id:"recruitment", icon:"🧑‍💼", name:"Recruitment", group:"People Ops", desc:"Job requisition, careers page, candidate pipeline, interviews, acceptance."},
    {id:"agentPlatform", icon:"🚀", name:"Agent Platform", group:"People Ops", desc:"Invitation, profile, documents, training progress, access readiness."},
    {id:"training", icon:"🎓", name:"Training Gate", group:"People Ops", desc:"Job-title and role-based learning that locks sensitive permissions until complete."},
    {id:"backoffice", icon:"🛡️", name:"Backoffice RBAC", group:"Governance", desc:"Departments, job titles, custom roles, permissions, documents, access readiness."},
    {id:"finance", icon:"💰", name:"Finance & Commission", group:"Finance/Sales", desc:"Commission policies, override approvals, salary reflection, finance reports."},
    {id:"reports", icon:"📑", name:"Reports & Analytics", group:"Governance", desc:"Role-based reports with reconciled metric dictionary and audited exports."},

  function load(){

      const saved = localStorage.getItem(STORAGE_KEY);
      if(saved) return JSON.parse(saved);
    }catch(e){}
    return defaultState();

  function fmt(n){ return new Intl.NumberFormat("en-US").format(Math.round(n)); }
  function money(n){ return fmt(n) + " EGP"; }
  function nowStamp(){ return new Date().toLocaleString("en-GB", {hour12:false}); }
  function current(){ return personas[state.currentPersona]; }
  function status(moduleId){ return current().modules[moduleId] || "denied"; }
  function moduleById(id){ return modules.find(m=>m.id===id); }
  function can(moduleId){ return status(moduleId) !== "denied"; }
  function isFull(moduleId){ return status(moduleId) === "full"; }
  function isLimited(moduleId){ return status(moduleId) === "limited"; }
  function esc(v){ return String(v ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
  function addAudit(action, detail){
    state.audit.unshift({time:nowStamp(), actor:current().label, action, detail});
    save();
  }
  function toast(msg){
    const wrap = document.getElementById("toast");
    const el = document.createElement("div");
    el.className = "toast-item";
    el.innerHTML = msg;
    wrap.appendChild(el);
    setTimeout(()=>{ el.style.opacity=.0; el.style.transform="translateY(6px)"; }, 2800);
    setTimeout(()=> el.remove(), 3300);
  }

  function visibleLeads(){
    const scope = current().dataScope;
    let leads = state.leads.slice();
    if(scope === "own") leads = leads.filter(l => l.ownerId === "agentOmar");
    if(scope === "teamAlpha") leads = leads.filter(l => l.team === "Alpha" || l.team === "Unassigned");
    if(scope === "manager") leads = leads.filter(l => ["Alpha","Beta","Unassigned"].includes(l.team));
    if(scope === "salesAll" || scope === "corporate") leads = leads;
    if(scope === "marketing") leads = leads.filter(l => l.source === "Marketplace" || l.source === "Campaign");
    if(scope === "finance") leads = state.leads.filter(l => state.deals.some(d => d.leadId === l.id));
    if(["hr","candidate","customer","system"].includes(scope)) leads = [];
    if(scope === "backoffice") leads = leads.filter(l => l.duplicate !== "Clear" || !l.owner);
    return leads;
  }
  function visibleDeals(){
    const scope = current().dataScope;
    let deals = state.deals.slice();
    if(scope === "own") deals = deals.filter(d => d.ownerId === "agentOmar");
    if(scope === "teamAlpha") deals = deals.filter(d => d.team === "Alpha");

    if(scope === "marketing") deals = deals.map(d => ({...d, customer:"Masked customer", owner:"Masked owner"}));
    if(["hr","candidate","customer","system"].includes(scope)) deals = [];
    return deals;

      html = map[activeModule]();
    }
    document.getElementById("content").innerHTML = html;
    attachEvents();
  }

  function showDenied(moduleId){
    const m = moduleById(moduleId);
    const p = current();
    const modal = document.getElementById("modal");
    modal.innerHTML = `<div class="modal">
      <div class="deny-illustration">🔒</div>
      <h3>Access Denied: ${m.name}</h3>
      <p>أنت داخل كـ <b>${p.label}</b>. حسب الـ BRD، هذا الدور ليس له علاقة بهذا الموديول أو لا يملك permissions المطلوبة.</p>
      <div class="grid cols-2" style="margin-top:14px">
        <div class="card"><h3>Current Scope</h3><p>${p.scope}</p></div>
        <div class="card"><h3>Why blocked?</h3><p>${p.restrictions.join(" • ")}</p></div>
      </div>
      <div class="modal-actions">
        <button class="btn primary" id="closeModal">فهمت</button>
        <button class="btn" id="switchToAllowed">Open My Dashboard</button>
      </div>
    </div>`;
    modal.classList.add("show");
    document.getElementById("closeModal").onclick = ()=> modal.classList.remove("show");
    document.getElementById("switchToAllowed").onclick = ()=>{ modal.classList.remove("show"); activeModule="dashboard"; render(); }
  }

  function attachEvents(){
    document.querySelectorAll("[data-open-lead]").forEach(b=> b.onclick=()=>openLead(b.dataset.openLead));
    document.querySelectorAll("[data-assign]").forEach(b=> b.onclick=()=>assignLeadDialog(b.dataset.assign));
    const cap = document.getElementById("captureLeadBtn");
    if(cap) cap.onclick = captureLead;
    const dup = document.getElementById("duplicateReviewBtn");
    if(dup) dup.onclick = () => { addAudit("Duplicate Review", current().label + " ran duplicate review on visible leads."); toast("Duplicate review run logged in audit."); render(); };
    document.querySelectorAll("[data-complete-task]").forEach(b=> b.onclick=()=>completeTask(b.dataset.completeTask));
    document.querySelectorAll("[data-approve-deal]").forEach(b=> b.onclick=()=>approveDeal(b.dataset.approveDeal));
    document.querySelectorAll("[data-export]").forEach(b=> b.onclick=()=>{ addAudit("Report Export", current().label + " exported " + b.dataset.export + " with current filters."); toast("Export audited: " + b.dataset.export); render(); });
    document.querySelectorAll("[data-move-candidate]").forEach(b=> b.onclick=()=>moveCandidate(b.dataset.moveCandidate));
    const saveRole = document.getElementById("saveRoleBtn");
    if(saveRole) saveRole.onclick = () => { addAudit("Role Permission Change", "Backoffice saved permission changes in Role Builder prototype."); toast("Role changes saved and audited."); render(); };
    const search = document.getElementById("leadSearch");
    if(search) search.oninput = filterLeadTable;
    const filter = document.getElementById("leadStageFilter");
    if(filter) filter.onchange = filterLeadTable;
  }

  function filterLeadTable(){
    const q = (document.getElementById("leadSearch")?.value || "").toLowerCase();
    const st = (document.getElementById("leadStageFilter")?.value || "").toLowerCase();
    document.querySelectorAll("[data-lead-row]").forEach(row=>{
      const okQ = row.textContent.toLowerCase().includes(q);
      const okSt = !st || row.dataset.stage === st;
      row.style.display = okQ && okSt ? "" : "none";
    });
  }

  function openLead(id){
    const l = state.leads.find(x=>x.id===id);
    const d = state.deals.find(x=>x.leadId===id);
    const drawer = document.getElementById("drawer");
    const pii = showPII();
    drawer.innerHTML = `<div class="drawer-head">
      <div><h3>${esc(l.id)} — ${pii?esc(l.name):"Masked Lead"}</h3><p style="color:var(--muted);margin:4px 0 0">${esc(l.stage)} • ${esc(l.source)}</p></div>
      <button class="btn" id="closeDrawer">✕</button>
    </div>
    <div class="kv"><span>Contact</span><b>${pii?esc(l.phone):'<span class="badge denied">PII masked</span>'}</b></div>
    <div class="kv"><span>Email</span><b>${pii?esc(l.email):'<span class="badge denied">PII masked</span>'}</b></div>
    <div class="kv"><span>Source</span><b>${esc(l.source)} / ${esc(l.campaign)}</b></div>
    <div class="kv"><span>Project</span><b>${esc(l.project)} / ${esc(l.developer)}</b></div>
    <div class="kv"><span>Budget</span><b>${showFinanceSensitive() || ["agent","teamLeader","salesManager"].includes(state.currentPersona)?money(l.budget):'<span class="badge denied">Hidden</span>'}</b></div>
    <div class="kv"><span>Owner</span><b>${esc(l.owner || "Manager Queue")}</b></div>
    <div class="kv"><span>Team</span><b>${esc(l.team)}</b></div>
    <div class="kv"><span>Duplicate</span><b>${esc(l.duplicate)}</b></div>
    <div class="kv"><span>Manual Protection</span><b>${l.manualProtected ? "Protected 6 months" : "No protection"}</b></div>
    <div class="kv"><span>Preference</span><b>${l.preference}% complete</b></div>
    <div class="kv"><span>Deal</span><b>${d ? esc(d.id)+" / "+esc(d.stage) : "No deal yet"}</b></div>
    <div class="section-head"><div><h3>Actions</h3><p>Disabled buttons show real permission boundaries.</p></div></div>
    <div class="tag-row">
      <button class="btn primary" ${actorOwns(l.ownerId)?'':'disabled'}>Edit Qualification</button>
      <button class="btn" ${actorOwns(l.ownerId)?'':'disabled'}>Create Task</button>
      <button class="btn" ${canAssign()?`data-assign="${l.id}"`:'disabled'}>Reassign</button>
      <button class="btn warning" ${["salesManager","salesDirector"].includes(state.currentPersona)?'':'disabled'}>Override Manual Protection</button>
    </div>`;
    drawer.classList.add("open");
    document.getElementById("closeDrawer").onclick = ()=>drawer.classList.remove("open");
    drawer.querySelectorAll("[data-assign]").forEach(b=> b.onclick=()=>assignLeadDialog(b.dataset.assign));
  }

  function assignLeadDialog(id){
    const l = state.leads.find(x=>x.id===id);
    if(!canAssign()){ showDenied("hierarchy"); return; }
    const teamOptions = state.currentPersona==="teamLeader"
      ? [{name:"Omar Agent", id:"agentOmar", team:"Alpha"},{name:"Yara Agent", id:"agentYara", team:"Alpha"}]
      : [{name:"Omar Agent", id:"agentOmar", team:"Alpha"},{name:"Yara Agent", id:"agentYara", team:"Alpha"},{name:"Mina Agent", id:"agentMina", team:"Beta"},{name:"Laila Agent", id:"agentLaila", team:"Beta"}];
    const modal = document.getElementById("modal");
    modal.innerHTML = `<div class="modal">
      <h3>Assign Lead ${esc(id)}</h3>
      <p>Assignment follows hierarchy and will create audit event. Team Leader can only assign within team scope.</p>
      <div class="grid cols-2" style="margin-top:14px">
        <div class="card"><h3>Lead</h3><p>${showPII()?esc(l.name):"Masked"} • ${esc(l.project)} • ${esc(l.priority)}</p></div>
        <div class="card"><h3>Current Owner</h3><p>${esc(l.owner || "Manager Queue")}</p></div>
      </div>
      <label class="label" style="margin-top:14px">Assign to</label>
      <select id="assignTo" class="select">${teamOptions.map(o=>`<option value="${o.id}|${o.name}|${o.team}">${o.name} — Team ${o.team}</option>`).join("")}</select>
      <div class="modal-actions">
        <button class="btn primary" id="confirmAssign">Assign & Audit</button>
        <button class="btn" id="closeModal">Cancel</button>
      </div>
    </div>`;
    modal.classList.add("show");
    document.getElementById("closeModal").onclick = ()=> modal.classList.remove("show");
    document.getElementById("confirmAssign").onclick = ()=>{
      const [ownerId,name,team] = document.getElementById("assignTo").value.split("|");
      l.ownerId = ownerId; l.owner = name; l.team = team; l.stage = l.stage==="Manager Queue"?"New":l.stage;
      addAudit("Lead Assignment", `${current().label} assigned ${l.id} to ${name} in Team ${team}.`);
      modal.classList.remove("show");
      toast(`Lead ${l.id} assigned to ${name}.`);
      render();
    };
  }

  function captureLead(){
    const name = document.getElementById("inqName").value || "New Customer";
    const phone = document.getElementById("inqPhone").value || "+20";
    const project = document.getElementById("inqProject").value;
    const intent = document.getElementById("inqIntent").value;
    const inv = state.inventory.find(u=>u.project===project) || state.inventory[0];
    const id = "L-" + (1000 + state.leads.length + 1);
    state.leads.unshift({id, name, phone, email:"captured@homes.eg", source:"Marketplace", campaign:intent, project, developer:inv.developer, budget:inv.price, stage:"Manager Queue", owner:null, ownerId:null, team:"Unassigned", manager:"Khaled Manager", duplicate:"Pending", priority:"Warm", nextAction:"Duplicate check + manager assignment", age:0, manualProtected:false, preference:10});
    addAudit("Marketplace Lead Capture", `${id} created from ${intent} with project ${project}.`);
    toast(`CRM intake event created: ${id}`);
    activeModule = state.currentPersona==="customer" ? "marketplace" : "crm";
    save();
    render();
  }

  function completeTask(id){
    const t = state.tasks.find(x=>x.id===id);
    if(!t) return;
    t.status = "Complete"; t.overdue=false;
    addAudit("Task Complete", `${current().label} completed task ${id}: ${t.title}`);
    toast("Task completed and timeline updated.");
    render();
  }

  function approveDeal(id){
    if(!canApproveFinance()){ showDenied("finance"); return; }
    const d = state.deals.find(x=>x.id===id);
    if(!d) return;
    d.approval = "Approved";
    d.financeState = "Validated";
    d.salaryReflection = "Ready";
    addAudit("Commission Approval", `${current().label} approved override/validation for ${id}.`);
    toast(`${id} approved and finance state validated.`);
    render();
  }

  function moveCandidate(id){
    const stages = ["New","Interview","Assessment","Offer","Accepted"];
    const c = state.candidates.find(x=>x.id===id);
    const i = stages.indexOf(c.stage);
    c.stage = stages[Math.min(stages.length-1, i+1)];
    addAudit("Candidate Stage Move", `${current().label} moved ${c.name} to ${c.stage}.`);
    toast(`${c.name} moved to ${c.stage}.`);
    render();
  }

  function showRoleExplanation(){
    const p=current();
    const modal = document.getElementById("modal");
    const rows = modules.map(m=>`<tr><td>${m.icon} ${m.name}</td><td><span class="badge ${status(m.id)}">${status(m.id)}</span></td><td>${m.desc}</td></tr>`).join("");
    modal.innerHTML = `<div class="modal" style="width:min(920px,96vw)">
      <h3>Access Explanation — ${p.label}</h3>
      <p>${p.story}</p>
      <div class="grid cols-2" style="margin-top:14px">
        <div class="card"><h3>Allowed Permissions</h3><div class="lens-list">${p.permissions.map(x=>`<span class="badge full">${esc(x)}</span>`).join("")}</div></div>
        <div class="card"><h3>Restrictions</h3><div class="lens-list">${p.restrictions.map(x=>`<span class="badge denied">${esc(x)}</span>`).join("")}</div></div>
      </div>
      <div class="table-wrap" style="margin-top:14px;max-height:320px;overflow:auto"><table><thead><tr><th>Module</th><th>Status</th><th>Meaning</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="modal-actions"><button class="btn primary" id="closeModal">Close</button></div>
    </div>`;
    modal.classList.add("show");
    document.getElementById("closeModal").onclick = ()=> modal.classList.remove("show");
  }

  function mobilePersonaDialog(){
    const modal = document.getElementById("modal");
    modal.innerHTML = `<div class="modal">
      <h3>Switch Persona</h3>
      <p>اختار role وشوف الـ UI والبيانات والصلاحيات تتغير فورًا.</p>
      <select id="modalPersona" class="select" style="margin-top:14px">${Object.entries(personas).map(([k,p])=>`<option value="${k}" ${k===state.currentPersona?'selected':''}>${p.label}</option>`).join("")}</select>
      <div class="modal-actions"><button class="btn primary" id="applyPersona">Apply</button><button class="btn" id="closeModal">Cancel</button></div>
    </div>`;
    modal.classList.add("show");
    document.getElementById("closeModal").onclick = ()=> modal.classList.remove("show");
    document.getElementById("applyPersona").onclick = ()=> {
      state.currentPersona = document.getElementById("modalPersona").value;
      if(status(activeModule)==="denied") activeModule = "dashboard";
      addAudit("Persona Switch", "Demo switched to " + current().label + " access lens.");
      modal.classList.remove("show");
      render();
    };
  }

  function reset(){
    localStorage.removeItem(STORAGE_KEY);
    state = defaultState();
    activeModule = state.activeModule;
    toast("Demo data reset.");
    render();
  }

  window.HomesDemo = {
    go(id){
      if(status(id)==="denied") return showDenied(id);
      activeModule=id; state.activeModule=id; save(); render();
    }
  };

  function render(){
    setupPersonaSelect();
    setTitle();
    renderRoleLens();
    renderNav();
    renderContent();
    save();
  }

  document.getElementById("explainRoleBtn").onclick = showRoleExplanation;
  document.getElementById("mobilePersonaBtn").onclick = mobilePersonaDialog;
  document.getElementById("resetBtn").onclick = reset;
  document.getElementById("modal").onclick = (e)=>{ if(e.target.id==="modal") e.currentTarget.classList.remove("show"); };

  render();
})();
</script>
</body>
</html>
